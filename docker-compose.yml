services:
  riptide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riptide-webhook
    restart: unless-stopped
    ports:
      - "8477:8477"
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID:-4262983}
      - GITHUB_PRIVATE_KEY_PATH=/app/github-private-key.pem
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-octopus-selfhost}
      - RIPTIDE_DATA_DIR=/data
      - RIPTIDE_DATA_DIR=/data
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:43311}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_REVIEW_MODEL=${OLLAMA_REVIEW_MODEL:-qwen2.5-coder:7b}
      - RETRIEVE_TOP_K=${RETRIEVE_TOP_K:-8}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./github-private-key.pem:/app/github-private-key.pem:ro
      - riptide-data:/data
    networks:
      - infra-net

networks:
  infra-net:
    external: true
    name: ${INFRA_NET:-infra-net}

volumes:
  riptide-data:
