name: riptide-review-required

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-riptide-review:
    name: Riptide Review Required
    runs-on: ubuntu-latest
    steps:
      - name: Check for Riptide review + follow-up commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Find the most recent Riptide review (contains ## 🔍 Findings)
          REVIEW=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.body | contains("## 🔍 Findings"))] | sort_by(.created_at) | last')

          REVIEW_ID=$(echo "${REVIEW}" | jq -r '.id // empty')

          if [ -z "${REVIEW_ID}" ]; then
            echo "::error::No Riptide review found on this PR. Comment '@riptide-bot review' to trigger one."
            exit 1
          fi

          # Check if review has findings (🔴 or 🟡 in table rows)
          HAS_FINDINGS=$(echo "${REVIEW}" | jq -r '
            if (.body // "" | test("\\|[\\s]*🔴|\\|[\\s]*🟡")) then "true" else "false" end
          ')

          if [ "${HAS_FINDINGS}" = "false" ]; then
            echo "Review is clean — no follow-up commit required."
            exit 0
          fi

          # Get review timestamp
          REVIEW_TIME=$(echo "${REVIEW}" | jq -r '.created_at')

          # Check for commits after the review
          FOLLOWUP_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq "[.[] | select((.commit.committer.date // .commit.author.date) > \"${REVIEW_TIME}\")] | length")

          if [ "${FOLLOWUP_COUNT}" -eq 0 ]; then
            echo "::error::Review has findings. At least one commit addressing them is required before merge."
            exit 1
          fi

          echo "✅ Follow-up commit(s) found (${FOLLOWUP_COUNT})"
