name: riptide-review-required

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The gate itself lives in scripts/check_riptide_review.sh so that it can be run
# and tested without GitHub; this step only feeds it the PR's comments and commits.
#
# What the gate enforces, and why each part of it is written the way it is:
#
#   * It judges the newest review — a comment recognised by '## 🔍 Findings' /
#     '## 🎯 Summary' / the 'Riptide Review ·' sign-off. Ordering: a Companion pass
#     ('## Riptide Pass:') posted after a review would otherwise shadow it, greening
#     the check while findings stand, so a pass is only used when there is nothing
#     else.
#   * A pass is not a review. It satisfies the gate — a PR must not be blocked
#     forever by a check nothing can clear — and the run reports that fact instead of
#     letting a green check imply the head was reviewed.
#   * A findings review needs a commit AFTER it that touches a file the findings
#     name. It used to accept any commit at all, which greened a check while every
#     finding stood.
#   * The Companion's complexity pre-pass ('## ✨ Review Required') is excluded: it
#     posts BEFORE the deep-think review, carries 🟡 rows, and would otherwise be read
#     as a findings-bearing review whenever the gate runs in the window between a
#     push and the review landing.
#   * Both exclusions are anchored to a comment's FIRST LINE, not the whole body: a
#     real review that merely quotes one of those headings (as a review of this
#     selector must) would otherwise be filtered out, and the gate would fall back to
#     an older comment — silently greening while that review's findings stood.
jobs:
  check-riptide-review:
    name: Riptide Review Required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Check for Riptide review + addressing commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Comments and commits for scripts/check_riptide_review.sh, straight from
          # the API so no fetch-depth is needed:
          #   review <id> <created_at> <base64 body>
          #   commit <sha> <committer-date>
          #   file   <path changed by that commit>
          data="$(mktemp)"
          shas="$(mktemp)"
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | "review \(.id) \(.created_at) \(.body | @base64)"' >"${data}"
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq '.[].sha' >"${shas}"
          while IFS= read -r sha; do
            [ -n "${sha}" ] || continue
            gh api "repos/${REPO}/commits/${sha}" \
              --jq '"commit \(.sha) \(.commit.committer.date // .commit.author.date)"' >>"${data}"
            gh api "repos/${REPO}/commits/${sha}" \
              --jq '(.files // [])[] | "file \(.filename)"' >>"${data}"
          done <"${shas}"

          bash scripts/check_riptide_review.sh "${data}"
