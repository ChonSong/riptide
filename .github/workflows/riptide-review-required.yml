name: riptide-review-required

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  check-riptide-review:
    name: Riptide Review Required
    runs-on: ubuntu-latest
    steps:
      - name: Check for full Riptide review + follow-up commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          # Pass user-controlled values through env to prevent shell injection
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Skip if comment is from a bot (prevent infinite loops)
          if [ "${COMMENT_USER_TYPE}" = "Bot" ]; then
            echo "Skipping — comment from bot"
            exit 0
          fi

          # For issue_comment events, only proceed if it's on a PR
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            ISSUE_DATA=$(gh api "repos/${REPO}/issues/${PR_NUMBER}" 2>/dev/null || echo "{}")
            IS_PR=$(echo "${ISSUE_DATA}" | jq -r '.pull_request // empty')
            if [ -z "${IS_PR}" ]; then
              echo "Skipping — comment is not on a PR"
              exit 0
            fi

            # Only process comments that might affect review state
            if ! echo "${COMMENT_BODY}" | grep -q "@riptide-bot review"; then
              if [ "${COMMENT_USER}" != "riptide-review[bot]" ]; then
                echo "Skipping — comment is not review-related"
                exit 0
              fi
            fi
          fi

          echo "Checking for full Riptide review on PR #${PR_NUMBER}..."

          # Only check issue comments for a DEEP-THINK review.
          # TL;DR (📊 Blast Radius, 🧒 ELI5) does NOT count —
          # we require "## 🎯 Summary" or "## 🔍 Findings".
          ISSUE_COMMENTS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null || echo "[]")

          # Find the most recent deep-think review by riptide-review[bot]
          # OR by any user if the review contains deep-think markers
          # (Hermes sessions post as the triggering user, not the bot)
          REVIEW=$(echo "${ISSUE_COMMENTS}" | jq '
            [.[] | select(
              (.user.login == "riptide-review[bot]" or
               (.body | test("## 🎯 Summary|## 🔍 Findings"; "i")))
            )]
            | sort_by(.created_at)
            | last
          ')

          REVIEW_ID=$(echo "${REVIEW}" | jq -r '.id // empty')

          if [ -z "${REVIEW_ID}" ]; then
            echo "::error::No full Riptide review found on this PR."
            echo ""
            echo "A deep-think review (## 🎯 Summary) is required, not just the TL;DR."
            echo ""
            echo "To trigger a deep-think review:"
            echo "  Comment '@riptide-bot review' on this PR, OR"
            echo "  Wait for the automated cron review (every 15 min, PRs >100 LOC)"
            exit 1
          fi

          echo "✅ Full Riptide review found (comment #${REVIEW_ID})"

          # Check if the review has findings (🔴 critical or 🟡 warning in table rows)
          # Match only as table row markers: "| 🔴 " or "| 🟡 " to avoid false positives
          # from prose like "No 🔴 issues found"
          HAS_FINDINGS=$(echo "${REVIEW}" | jq -r '
            if (.body // "" | test("\\|[\\s]*🔴|\\|[\\s]*🟡")) then "true" else "false" end
          ')

          if [ "${HAS_FINDINGS}" = "false" ]; then
            echo "Review is clean — no follow-up commit required."
            exit 0
          fi

          echo "Review has findings (🔴/🟡). Checking for follow-up commit..."

          # Get the review's created_at timestamp
          REVIEW_TIME=$(echo "${REVIEW}" | jq -r '.created_at')

          # Check for commits after the review was posted (with error handling)
          FOLLOWUP_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq "[.[] | select(.commit.committer.date > \"${REVIEW_TIME}\")] | length" 2>/dev/null || echo "0")

          if [ "${FOLLOWUP_COUNT}" -eq 0 ]; then
            echo "::error::Review found issues. At least one commit addressing them is required before merge."
            echo ""
            echo "Commit your fixes, push to this branch, and CI will re-run."
            exit 1
          fi

          echo "✅ Follow-up commit(s) found (${FOLLOWUP_COUNT})"
