name: riptide-review-required

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-riptide-review:
    name: Riptide Review Required
    runs-on: ubuntu-latest
    steps:
      - name: Check for Riptide review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Checking for Riptide review on PR #${PR_NUMBER}..."

          # Check issue comments (where riptide-review[bot] posts TL;DR and trigger confirmations)
          ISSUE_COMMENTS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null || echo "[]")

          # Check PR comments (inline reviews)
          PR_COMMENTS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" --paginate 2>/dev/null || echo "[]")

          # Check PR reviews (summary reviews)
          PR_REVIEWS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate 2>/dev/null || echo "[]")

          # Look for Riptide review markers in any comment
          # Reviews can be posted by riptide-review[bot] OR by the user (ChonSong)
          # when a deep-think session posts findings
          RIPTIDE_REVIEW=$(echo "${ISSUE_COMMENTS}" "${PR_COMMENTS}" "${PR_REVIEWS}" | jq -s '
            .[][] |
            select(
              .user.login == "riptide-review[bot]" or
              ((.body // "") | test("🤖 Generated by Riptide|## 🔄|Riptide Review|⏱️|📊 Blast Radius|🧠|🎯 Summary|🔍 Findings|riptide|Riptide"; "i"))
            ) |
            .id
          ' | head -1)

          if [ -z "${RIPTIDE_REVIEW}" ] || [ "${RIPTIDE_REVIEW}" = "null" ]; then
            echo "::error::No Riptide review found on this PR. A review from @riptide-review[bot] is required before merge."
            echo ""
            echo "To trigger a Riptide review:"
            echo "  1. Comment '@riptide-bot review' on this PR, OR"
            echo "  2. Wait for the automated cron review (runs every 15 minutes for PRs >100 LOC)"
            echo ""
            echo "The review will:"
            echo "  - Analyze the full diff with graphify blast-radius"
            echo "  - Post inline suggestions for issues found"
            echo "  - Generate an Excalidraw architecture diagram"
            exit 1
          fi

          echo "✅ Riptide review found on PR #${PR_NUMBER}"
