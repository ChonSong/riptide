name: riptide-review-required

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-riptide-review:
    name: Riptide Review Required
    runs-on: ubuntu-latest
    steps:
      - name: Check for full Riptide review + follow-up commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Checking for full Riptide review on PR #${PR_NUMBER}..."

          # Only check issue comments for a DEEP-THINK review.
          # TL;DR (📊 Blast Radius, 🧒 ELI5) does NOT count —
          # we require "## 🎯 Summary" or "## 🔍 Findings".
          ISSUE_COMMENTS=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate 2>/dev/null || echo "[]")

          # Find the most recent deep-think review by riptide-review[bot]
          REVIEW=$(echo "${ISSUE_COMMENTS}" | jq '
            [.[] | select(.user.login == "riptide-review[bot]" and (.body | test("## 🎯 Summary|## 🔍 Findings"; "i")))]
            | sort_by(.created_at)
            | last
          ')

          REVIEW_ID=$(echo "${REVIEW}" | jq -r '.id // empty')

          if [ -z "${REVIEW_ID}" ]; then
            echo "::error::No full Riptide review found on this PR."
            echo ""
            echo "A deep-think review (## 🎯 Summary) is required, not just the TL;DR."
            echo ""
            echo "To trigger a deep-think review:"
            echo "  Comment '@riptide-bot review' on this PR, OR"
            echo "  Wait for the automated cron review (every 15 min, PRs >100 LOC)"
            exit 1
          fi

          echo "✅ Full Riptide review found (comment #${REVIEW_ID})"

          # Check if the review has findings (🔴 critical or 🟡 warning)
          HAS_FINDINGS=$(echo "${REVIEW}" | jq -r '
            if (.body | test("🔴|🟡"; "i")) then "true" else "false" end
          ')

          if [ "${HAS_FINDINGS}" = "false" ]; then
            echo "Review is clean — no follow-up commit required."
            exit 0
          fi

          echo "Review has findings (🔴/🟡). Checking for follow-up commit..."

          # Get the review's created_at timestamp
          REVIEW_TIME=$(echo "${REVIEW}" | jq -r '.created_at')

          # Check for commits after the review was posted
          FOLLOWUP_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq "[.[] | select(.commit.committer.date > \"${REVIEW_TIME}\")] | length")

          if [ "${FOLLOWUP_COUNT}" -eq 0 ]; then
            echo "::error::Review found issues. At least one commit addressing them is required before merge."
            echo ""
            echo "Commit your fixes, push to this branch, and CI will re-run."
            exit 1
          fi

          echo "✅ Follow-up commit(s) found (${FOLLOWUP_COUNT})"
