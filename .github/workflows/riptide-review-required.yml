name: riptide-review-required

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-riptide-review:
    name: Riptide Review Required
    runs-on: ubuntu-latest
    steps:
      - name: Check for Riptide review + follow-up commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Find the most recent Riptide review.
          # A review is recognised by '## 🔍 Findings' / '## 🎯 Summary' / the
          # 'Riptide Review ·' sign-off. The Companion's pass confirmation
          # ('## Riptide Pass:') also satisfies the gate — it means the
          # deterministic pass ran and found nothing — but it is deliberately
          # NOT a review marker, so the poller still asks for a real review.
          #
          # The Companion's complexity pre-pass ('## ✨ Review Required') is
          # excluded on purpose: it posts BEFORE the deep-think review, carries
          # 🟡 rows, and would otherwise be read as a findings-bearing review
          # whenever the gate runs in the window between a push and the review
          # landing — turning a clean PR red.
          REVIEW=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select((.body | contains("## ✨ Review Required")) | not) | select(.body | (contains("## 🔍 Findings") or contains("## 🎯 Summary") or contains("Riptide Review ·") or contains("## Riptide Pass:")))] | sort_by(.created_at) | last')

          REVIEW_ID=$(echo "${REVIEW}" | jq -r '.id // empty')

          if [ -z "${REVIEW_ID}" ]; then
            echo "::error::No Riptide review found on this PR. Comment '@riptide-bot review' to trigger one."
            exit 1
          fi

          # Check if review has findings (🔴 or 🟡 in table rows)
          HAS_FINDINGS=$(echo "${REVIEW}" | jq -r '
            if (.body // "" | test("\\|[\\s]*🔴|\\|[\\s]*🟡")) then "true" else "false" end
          ')

          if [ "${HAS_FINDINGS}" = "false" ]; then
            echo "Review is clean — no follow-up commit required."
            exit 0
          fi

          # Get review timestamp
          REVIEW_TIME=$(echo "${REVIEW}" | jq -r '.created_at')

          # Check for commits after the review
          FOLLOWUP_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate \
            --jq "[.[] | select((.commit.committer.date // .commit.author.date) > \"${REVIEW_TIME}\")] | length")

          if [ "${FOLLOWUP_COUNT}" -eq 0 ]; then
            echo "::error::Review has findings. At least one commit addressing them is required before merge."
            exit 1
          fi

          echo "✅ Follow-up commit(s) found (${FOLLOWUP_COUNT})"
