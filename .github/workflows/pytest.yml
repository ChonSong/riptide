name: pytest

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Docs-only runs need no write access anywhere.
permissions:
  contents: read

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest baseline gate
    runs-on: ubuntu-latest
    # The hermetic suite is ~40s locally; 25 min bounds a cold-cache CI run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements.txt pins the app only — the test runner and the
          # httpx dependency of fastapi.testclient are needed for the suite.
          pip install pytest httpx
      - name: Check test failures against the baseline
        run: |
          set -uo pipefail
          # Fails when the suite has a failure that is not in
          # riptide/tests/baseline_failures.txt (or, with --strict-stale, when a
          # baseline entry has started passing). Capture the exit code so the
          # summary is published even on a red run.
          python scripts/check_test_baseline.py --summary /tmp/baseline-summary.md
          code=$?
          cat /tmp/baseline-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$code"
      - name: Check the repo-root tests against their baseline
        run: |
          set -uo pipefail
          # tests/ is a second pytest target with its own baseline. It is gated
          # for the same reason: ungated, it sat 24 failures deep on main without
          # anything noticing.
          python scripts/check_test_baseline.py \
            --tests tests \
            --baseline tests/baseline_failures.txt \
            --summary /tmp/root-baseline-summary.md
          code=$?
          cat /tmp/root-baseline-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$code"
